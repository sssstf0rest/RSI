name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  sandbox:
    name: Linux sandbox boundary (no inference)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update
      - run: sudo apt-get install --yes bubblewrap
      - run: npm install --global @openai/codex
      - run: codex --version
      - run: python -m pip install -e .
      - name: Verify actual policy and filesystem boundaries
        env:
          RSI_REAL_SANDBOX: '1'
        run: python -m unittest discover -s tests -p test_sandbox_integration.py -v
      - name: Complete offline evolution through the production sandbox
        run: rsi experiment --candidate benchmarks/examples/lexical
