[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-agent"
version = "0.1.0"
description = "A small, supervised seed for an evolving personal agent."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rsi = "rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rsi*"]
